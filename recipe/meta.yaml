{% set name = "aiocsv" %}
{% set version = "1.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/aiocsv-{{ version }}.tar.gz
  sha256: 74ad4bb7d7398e1ff4f90642f41d1a4da3d2e8b795ca4451390cabead1f315a4

build:
  skip: true  # [py<38]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - setuptools >=61.0
    - wheel
    - pip
  run:
    - python
    - typing_extensions

test:
  imports:
    - aiocsv
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/MKuranowski/aiocsv
  summary: Asynchronous CSV reading/writing
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - apmorton
